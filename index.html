<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10161d"><title>Slot to Survive — Story Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{font-family:"DM Sans",system-ui,sans-serif;background:#10161d;color:#eaf0f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}a:hover{color:#fd797a}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{background:#151f28;border-right:1px solid #2a3641;padding:26px 17px;position:sticky;top:0;height:100vh;overflow:auto}.logo{font-family:"Barlow Condensed",sans-serif;font-size:31px;font-weight:800;line-height:.95;letter-spacing:.6px;padding:12px 11px 25px}.logo b{color:#ea5158}.meta{font-size:10px;letter-spacing:1.8px;color:#96aab8;text-transform:uppercase;font-weight:700;margin:18px 10px 9px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:0;border-radius:8px;background:transparent;color:#aebdc9;text-align:left;font-size:13px;font-weight:600}.nav button:hover,.nav button.active{background:#283440;color:#fff}.nav button.active{box-shadow:inset 3px 0 #f05b60}.count{font-size:11px;color:#96a6b3}.sidefoot{border-top:1px solid #2b3a46;margin-top:28px;padding:17px 10px 0;color:#8ba0af;font-size:11px;line-height:1.8}.sidefoot button{background:none;color:#dce7ef;border:1px solid #42515d;padding:7px 9px;border-radius:6px;margin-top:7px;font-size:11px}.main{min-width:0;padding:39px clamp(18px,4vw,65px) 80px;max-width:1500px;width:100%;margin:auto}.eyebrow{color:#e56b6f;font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase;margin-bottom:9px}.page-title{font:800 clamp(36px,5vw,66px)/.96 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:0 0 14px}.lead{color:#a8bbc9;max-width:780px;line-height:1.7;margin:0 0 26px;font-size:14px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}.input,.textarea,.select{background:#1b2630;border:1px solid #394853;color:#f2f5f7;border-radius:8px;padding:12px 14px;outline:none;min-width:0}.input:focus,.textarea:focus{border-color:#e65c64}.input{width:min(100%,390px)}.textarea{width:100%;min-height:120px;resize:vertical;line-height:1.6}.select{min-width:150px}.btn{border:1px solid #40515f;border-radius:7px;padding:10px 14px;background:#253441;color:#e8f0f4;font-weight:700;font-size:12px}.btn:hover{background:#354654}.btn.red{background:#eb535b;color:#fff;border-color:#eb535b}.btn.red:hover{background:#d43d45}.muted{color:#96aab9}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#1a252f;border:1px solid #30404e;border-radius:11px;padding:20px;min-width:0}.card.click{cursor:pointer;transition:transform .15s,border-color .15s}.card.click:hover{border-color:#e76b70;transform:translateY(-2px)}.card h2,.card h3{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;letter-spacing:.3px;font-size:27px;line-height:1.05}.card p{font-size:13px;line-height:1.65;color:#b1c0ca}.chip{display:inline-block;background:#30414e;border:1px solid #435563;border-radius:5px;color:#ced9e0;font-size:10px;font-weight:700;padding:5px 8px;letter-spacing:.3px}.chip.red{background:#4f2b32;border-color:#88444c;color:#ffb6bb}.portrait{height:150px;background:radial-gradient(circle at 65% 10%,#3b5364,#1e2c38 65%);display:flex;align-items:center;justify-content:center;border-radius:8px;margin-bottom:15px;position:relative;overflow:hidden}.portrait:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 65%,#0e141d90);pointer-events:none}.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}.portrait .initials{position:relative;z-index:0}.portrait img.loaded{z-index:1}.portrait .tagtop{z-index:3}.initials{font:800 75px/1 "Barlow Condensed",sans-serif;color:#a2b5c3;opacity:.28}.tagtop{position:absolute;top:10px;left:10px;z-index:1}.number{font:800 54px/1 "Barlow Condensed",sans-serif}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.stat{padding:20px;background:#1c2832;border:1px solid #344450;border-radius:9px}.stat .number{font-size:38px;color:#fafcfd}.stat p{margin:4px 0 0;color:#9caeba;font-size:12px}.hero{padding:38px;background:linear-gradient(110deg,#222e39,#171f29);border:1px solid #3b4d5c;border-radius:12px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;right:-40px;top:-95px;width:440px;height:360px;border:70px solid #e7475122;border-radius:50%;transform:rotate(-20deg)}.hero>*{position:relative}.hero h1{font:800 clamp(48px,7vw,96px)/.85 "Barlow Condensed",sans-serif;margin:10px 0 20px;letter-spacing:1px}.hero h1 span{color:#f06469}.section{margin:37px 0 15px;font:700 28px "Barlow Condensed",sans-serif;letter-spacing:.3px;text-transform:uppercase}.personhead{display:grid;grid-template-columns:155px 1fr;gap:24px;align-items:center;margin-bottom:25px}.personhead .portrait{height:180px;margin:0}.detailgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}.info{margin-bottom:19px}.info h3{font-size:11px;letter-spacing:1.7px;color:#e87a80;text-transform:uppercase;margin:0 0 9px}.info p{font-size:14px;color:#c1ced7;line-height:1.8;margin:0;white-space:pre-line}.linkrow{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;border-top:1px solid #34434f;padding:15px 0;cursor:pointer}.linkrow:hover .link-title{color:#ff8b90}.link-title{font-weight:700;font-size:14px}.list{display:flex;flex-direction:column}.line{height:1px;background:#33434d;margin:15px 0}.post{border-top:1px solid #354653;padding:18px 0}.post:first-child{border-top:0}.post .author{font-weight:800;font-size:12px;color:#f0a0a2;margin-bottom:8px}.post .body{line-height:1.8;font-size:13px;white-space:pre-wrap;color:#d3dce3}.threadmeta{font-size:11px;color:#91a6b4;margin-top:5px}.timeline{border-left:1px solid #485765;margin-left:9px;padding-left:24px}.event{position:relative;padding:0 0 25px}.event:before{content:"";width:10px;height:10px;background:#ef6368;border:3px solid #1b2730;border-radius:50%;position:absolute;left:-33px;top:2px}.year{font:800 23px "Barlow Condensed";color:#f07579}.event h3{font-size:15px;margin:2px 0 5px}.event p{font-size:13px;color:#b2c0ca;line-height:1.65;margin:0}.notice{background:#26313b;border-left:3px solid #e36569;padding:14px 17px;color:#c4d2da;font-size:12px;line-height:1.7;border-radius:4px}.empty{padding:30px;text-align:center;color:#91a7b7;border:1px dashed #4a5a67;border-radius:8px}.hidden{display:none!important}dialog{background:#19252f;color:#edf2f4;border:1px solid #415462;border-radius:12px;width:min(92vw,670px);max-height:90vh;overflow:auto;padding:24px}dialog::backdrop{background:#02060acc}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.modalhead h2{margin:0;font:700 30px "Barlow Condensed"}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#a6bac9}.field .input{width:100%}.footer{font-size:11px;color:#8498a8;border-top:1px solid #31404c;margin-top:50px;padding-top:20px;line-height:1.8}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detailgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{display:block}.sidebar{position:relative;height:auto;padding:12px 14px}.logo{font-size:25px;padding:6px 2px 10px}.meta,.sidefoot{display:none}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:9px 12px;font-size:11px}.nav .count{display:none}.main{padding:24px 16px 55px}.grid,.grid.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{padding:26px}.personhead{grid-template-columns:92px 1fr;gap:13px}.personhead .portrait{height:125px}.portrait{height:130px}.personhead .page-title{font-size:38px}.topline{display:block}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo">SLOT <b>TO</b><br>SURVIVE<span style="font-size:11px;display:block;margin-top:10px;color:#8fa4b3;letter-spacing:2px;font-family:DM Sans">THE STORY ROOM</span></div><div class="meta">Workspace</div><nav class="nav" id="nav"></nav><div class="sidefoot">FICTIONAL UNIVERSE · 2026<br>Authoring workspace, not the public-facing NSRC or documentary site.<br><button id="exportBtn">Export backup ↗</button><button id="importBtn">Import backup ↗</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></aside><main class="main" id="view"></main></div><dialog id="editor"><div class="modalhead"><h2 id="modalTitle">Edit</h2><button class="btn" id="closeModal">Close</button></div><form id="editForm"></form></dialog><script src="./data.js"></script><script>
(()=>{"use strict";
let BASE=window.STORY_DATA||{people:[],events:[],scandals:[],threads:[],manufacturers:[]};const KEY="slot-to-survive-story-room-v1";
let local={notes:{},overrides:{},replies:{},threads:[]};try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&typeof v==="object")local={...local,...v}}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(local));window.dispatchEvent(new Event('storyroom:dirty'))}catch{alert("Browser storage unavailable; please export a backup.")}};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=(name)=>String(name).toLowerCase().replace(/[^a-z0-9]+/g,"-");
const getPerson=p=>({...p,...(local.overrides[p.id]||{})});
const people=()=>BASE.people.map(getPerson);
const person=id=>people().find(p=>p.id===id);
const allThreads=()=>[...BASE.threads,...local.threads];
const navItems=[["home","Overview"],["people","Characters"],["teams","Teams & alliances"],["timeline","Chronology"],["scandals","Scandals"],["forum","Forum archive"],["manufacturers","Manufacturers"]];
const link=(page,id)=>"#/"+page+(id?"/"+encodeURIComponent(id):"");
function renderNav(page){document.getElementById("nav").innerHTML=navItems.map(([id,label])=>'<button class="'+(page===id?"active":"")+'" data-go="'+id+'">'+label+'<span class="count">'+(id==="people"?people().length:id==="scandals"?BASE.scandals.length:id==="forum"?allThreads().length:"")+'</span></button>').join("");document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=link(b.dataset.go))}
function head(k,title,lead){return '<div class="eyebrow">'+esc(k)+'</div><h1 class="page-title">'+esc(title)+'</h1><p class="lead">'+esc(lead)+'</p>'}
function portrait(p){return '<div class="portrait"><span class="tagtop chip">'+esc(p.age)+" · "+esc(p.team)+'</span><span class="initials">'+esc(p.name.split(" ").map(n=>n[0]).slice(0,2).join(""))+'</span><img loading="lazy" src="./portraits/'+encodeURIComponent(p.id)+'.jpg" alt="Portrait of '+esc(p.name)+'" onload="this.classList.add(\'loaded\')" onerror="this.remove()"></div>'}
function personCard(p){return '<div class="card click" data-person="'+esc(p.id)+'">'+portrait(p)+'<h2>'+esc(p.name)+'</h2><div class="small muted">'+esc(p.nickname?'"'+p.nickname+'" · ':'')+esc(p.role)+'</div><p>'+esc(p.backstory.slice(0,190))+'…</p></div>'}
function wirePeople(){document.querySelectorAll("[data-person]").forEach(el=>el.onclick=()=>location.hash=link("people",el.dataset.person))}
function home(){const recent=BASE.scandals.slice(0,3);return '<div class="hero"><div class="eyebrow">Private creative workspace · Fictional canon</div><h1>EVERY GRUDGE<br><span>HAS A HISTORY.</span></h1><p class="lead">The complete story universe behind Slot to Survive. Follow rivalries, reconcile timelines, maintain character canon, and write the NSRC message-board history before the documentary ever airs.</p><button class="btn red" data-go="people">Explore the cast</button> <button class="btn" data-go="forum">Open the forum</button></div><div class="stats">'+[["21","Characters"],["14","Competitors"],["10","Scandal files"],["7+","Seeded threads"]].map(x=>'<div class="stat"><div class="number">'+x[0]+'</div><p>'+x[1]+'</p></div>').join("")+'</div><h2 class="section">The central conflict</h2><div class="grid two"><div class="card"><span class="chip red">NEW GUARD</span><h2 style="margin-top:15px">MERCER RACING</h2><p>Jake, Dennis, Elaine and Dale challenge the establishment. One 46-year-old champion wants a fourth title and an easier way for newcomers to get involved.</p></div><div class="card"><span class="chip red">OLD GUARD</span><h2 style="margin-top:15px">VOSS COMPETITION</h2><p>Richard, Terry, Gordon and Frank defend tradition and the league’s power structure—while accusing the younger drivers of undermining sporting integrity.</p></div></div><h2 class="section">Priority storylines</h2><div class="grid">'+recent.map(s=>'<div class="card click" data-scandal="'+esc(s.id)+'"><span class="chip">'+esc(s.period)+'</span><h3 style="margin-top:15px">'+esc(s.title)+'</h3><p>'+esc(s.claims)+'</p></div>').join("")+'</div><div class="notice" style="margin-top:26px">Story-room edits are saved in this browser only. Use “Export backup” to preserve new notes and forum posts, and update data.js in GitHub when you want changes shared across devices.</div>'}
function peoplePage(){return head("Character database","The cast","Twenty-one interconnected personalities. Select anyone to view their biography, motivations, private contradictions and relationships. Profiles can be edited locally.")+'<div class="toolbar"><input class="input" id="search" placeholder="Search names, backstories, relationships…"><select class="select" id="teamFilter"><option value="">All factions</option><option>Mercer Racing</option><option>Voss Competition</option><option>Independent</option><option>Production crew</option><option>Family</option><option>Sponsor</option></select></div><div class="grid" id="personGrid">'+people().map(personCard).join("")+'</div>'}
function personPage(id){const p=person(id);if(!p)return head("Not found","Unknown character","This profile does not exist.");const note=local.notes[id]??BASE.notes?.[id]??"";return '<button class="btn" data-go="people">← All characters</button><div class="personhead" style="margin-top:24px">'+portrait(p)+'<div><div class="eyebrow">Character dossier · Age '+esc(p.age)+'</div><h1 class="page-title">'+esc(p.name)+'</h1><span class="chip red">'+esc(p.nickname||p.role)+'</span><span class="chip" style="margin-left:6px">'+esc(p.team)+'</span></div></div><div class="detailgrid"><div class="card"><div class="info"><h3>Full backstory & history</h3><p>'+esc(p.backstory)+'</p></div><div class="line"></div><div class="info"><h3>Season goal</h3><p>'+esc(p.goal)+'</p></div><div class="line"></div><div class="info"><h3>Fatal flaw / private reality</h3><p>'+esc(p.flaw)+'</p></div><div class="line"></div><div class="info"><h3>Relationships, alliances & feuds</h3><p>'+esc(p.relationships)+'</p></div><button class="btn red" id="editPerson" data-id="'+esc(id)+'">Edit character profile</button></div><div><div class="card"><div class="info"><h3>Role</h3><p>'+esc(p.role)+'</p></div><div class="info"><h3>Faction</h3><p>'+esc(p.team)+'</p></div><h3 style="font-size:15px">Writer’s notes</h3><textarea class="textarea" id="personNote" placeholder="Add secrets, dialogue ideas, appearance notes, continuity questions…">'+esc(note)+'</textarea><button class="btn" id="saveNote">Save notes</button></div><div class="card" style="margin-top:15px"><div class="info"><h3>Related scandals</h3></div>'+BASE.scandals.filter(s=>s.involved.toLowerCase().includes(p.name.split(" ")[0].toLowerCase())||s.involved.toLowerCase().includes(p.name.split(" ").slice(-1)[0].toLowerCase())).map(s=>'<div class="linkrow" data-scandal="'+esc(s.id)+'"><span class="link-title">'+esc(s.title)+'</span><span>↗</span></div>').join("")+'</div></div></div>'}
function teams(){const group=[["Mercer Racing",["jake","dennis","elaine","dale"],"The new guard · Technology and participation"],["Voss Competition",["richard","terry","gordon","frank"],"The old guard · Tradition and authority"],["Independents",["gary","martin","brent","neil","stanley","elliot"],"Everyone claims neutrality. Nobody is neutral."],["Production & others",["simon","pam","val","al","deborah","linda","susan"],"Insiders, observers and people who know too much"]];return head("Racing factions","Teams & alliances","Two team principals battle for control of the sport. Officiating, track ownership and personal grudges overlap everywhere.")+group.map(g=>'<h2 class="section">'+esc(g[0])+'</h2><p class="muted small">'+esc(g[2])+'</p><div class="grid">'+g[1].map(id=>person(id)).filter(Boolean).map(personCard).join("")+'</div>').join("")}
function timeline(){return head("Historical canon","The chronology","The events below are the writer’s version of history—not necessarily what the league admits publicly.")+'<div class="timeline">'+BASE.events.map(e=>'<div class="event"><div class="year">'+esc(e.year)+'</div><h3>'+esc(e.title)+'</h3><p>'+esc(e.details)+'</p></div>').join("")+'</div>'}
function scandalList(){return head("Investigations","Scandal files","Each case separates the underlying facts from the accusations. Treat claims as character perspectives, not verified truth.")+'<div class="grid two">'+BASE.scandals.map(s=>'<div class="card click" data-scandal="'+esc(s.id)+'"><span class="chip red">'+esc(s.period)+'</span><h2 style="margin-top:14px">'+esc(s.title)+'</h2><p>'+esc(s.involved)+'</p><p>'+esc(s.arc)+'</p></div>').join("")+'</div>'}
function scandalPage(id){const s=BASE.scandals.find(x=>x.id===id);if(!s)return scandalList();return '<button class="btn" data-go="scandals">← All scandal files</button><div style="margin-top:27px">'+head("Case file · "+s.period,s.title,s.involved)+'</div><div class="detailgrid"><div class="card"><div class="info"><h3>Canonical truth · Spoilers</h3><p>'+esc(s.truth)+'</p></div><div class="line"></div><div class="info"><h3>Public allegations & conflicting accounts</h3><p>'+esc(s.claims)+'</p></div></div><div class="card"><div class="info"><h3>Evidence and possible ARG artifacts</h3><p>'+esc(s.evidence)+'</p></div><div class="line"></div><div class="info"><h3>Narrative purpose</h3><p>'+esc(s.arc)+'</p></div><div class="line"></div><div class="info"><h3>Writer’s notes</h3><textarea class="textarea" id="caseNote">'+esc(local.notes[s.id]??BASE.notes?.[s.id]??"")+'</textarea><button class="btn" id="saveCaseNote" data-id="'+esc(s.id)+'">Save notes</button></div></div></div>'}
function forumPage(){return head("NSRC member forum","The forum archive","Write the posts that make this fictional league feel like it has existed for decades. Archived seed threads are read-only in the official canon; your drafts and replies are saved in this browser.")+'<div class="toolbar"><button class="btn red" id="newThread">+ New discussion</button><input class="input" id="threadSearch" placeholder="Search discussions…"></div><div class="card list" id="threadsList">'+allThreads().map(t=>'<div class="linkrow" data-thread="'+esc(t.id)+'"><div><div class="link-title">'+esc(t.title)+'</div><div class="threadmeta">'+esc(t.category)+' · '+esc(t.date)+' · '+(t.posts.length+(local.replies[t.id]||[]).length)+' posts</div></div><span class="chip">'+(t.locked?"Locked":"Open")+'</span></div>').join("")+'</div>'}
function threadPage(id){const t=allThreads().find(t=>t.id===id);if(!t)return forumPage();const posts=[...t.posts,...(local.replies[t.id]||[])];return '<button class="btn" data-go="forum">← Forum archive</button><div style="margin-top:25px">'+head(t.category,t.title,'Opened '+t.date+' · '+posts.length+' posts')+'</div><div class="card"><span class="chip">'+(t.locked?"Thread locked by moderator":"Open thread")+'</span>'+posts.map((p,i)=>'<div class="post"><div class="author">'+esc(p.author)+' <span class="muted">#'+(i+1)+'</span></div><div class="body">'+esc(p.body)+'</div></div>').join("")+'</div><div class="card" style="margin-top:16px"><h3 style="font-size:23px">Writer’s room: add a fictional reply</h3><p class="muted small">For authoring only. Replies do not publish to GitHub or synchronize between browsers.</p><div class="field"><label>Posting as</label><input class="input" id="replyAuthor" placeholder="e.g. Gary · TheTruth58"></div><div class="field"><label>Reply text</label><textarea class="textarea" id="replyBody" placeholder="Write an in-character post…"></textarea></div><button class="btn red" id="addReply">Add draft reply</button></div>'}
function manufacturers(){return head("Equipment and politics","Manufacturers","Four competing manufacturers; every driver has an opinion, usually a grievance.")+'<div class="grid two">'+BASE.manufacturers.map(m=>'<div class="card"><div class="eyebrow">'+esc(m.origin)+'</div><h2>'+esc(m.name)+'</h2><p>'+esc(m.profile)+'</p><div class="line"></div><div class="info"><h3>Key people</h3><p>'+esc(m.people)+'</p></div><div class="info"><h3>League connections</h3><p>'+esc(m.connections)+'</p></div></div>').join("")+'</div>'}
function openModal(title,body,onSubmit){document.getElementById("modalTitle").textContent=title;const form=document.getElementById("editForm");form.innerHTML=body;form.onsubmit=e=>{e.preventDefault();onSubmit(new FormData(form));document.getElementById("editor").close();route()};document.getElementById("editor").showModal()}
function field(k,label,value,large){return '<div class="field"><label>'+esc(label)+'</label>'+(large?'<textarea class="textarea" name="'+k+'">'+esc(value)+'</textarea>':'<input class="input" name="'+k+'" value="'+esc(value)+'">')+'</div>'}
function wire(page,id){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=link(b.dataset.go));document.querySelectorAll("[data-scandal]").forEach(b=>b.onclick=()=>location.hash=link("scandals",b.dataset.scandal));document.querySelectorAll("[data-thread]").forEach(b=>b.onclick=()=>location.hash=link("forum",b.dataset.thread));wirePeople();
if(page==="people"&&!id){const f=()=>{let q=document.getElementById("search").value.toLowerCase(),team=document.getElementById("teamFilter").value;document.getElementById("personGrid").innerHTML=people().filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!team||p.team.includes(team)||p.role.includes(team))).map(personCard).join("")||'<div class="empty">No matching characters.</div>';wirePeople()};document.getElementById("search").oninput=f;document.getElementById("teamFilter").onchange=f}
if(page==="people"&&id&&person(id)){document.getElementById("saveNote").onclick=()=>{local.notes[id]=document.getElementById("personNote").value;save();alert("Notes saved in this browser.")};document.getElementById("editPerson").onclick=()=>{const p=person(id),keys=[["name","Name"],["nickname","Nickname"],["age","Age"],["team","Faction"],["role","Role"],["backstory","Backstory"],["goal","Goal"],["flaw","Flaw"],["relationships","Relationships"]];openModal("Edit "+p.name,keys.map(([k,label])=>field(k,label,p[k],["backstory","goal","flaw","relationships"].includes(k))).join("")+'<button class="btn red" type="submit">Save character</button>',fd=>{const override={};keys.forEach(([k])=>override[k]=k==="age"?Number(fd.get(k)):String(fd.get(k)));local.overrides[id]=override;save()})}}
if(page==="scandals"&&id&&document.getElementById("saveCaseNote"))document.getElementById("saveCaseNote").onclick=()=>{local.notes[id]=document.getElementById("caseNote").value;save();alert("Case notes saved.")};
if(page==="forum"&&!id){document.getElementById("newThread").onclick=()=>openModal("Create fictional thread",field("title","Thread title","")+field("category","Category","General Discussion")+field("date","In-universe date","2026-11-06")+field("author","Opening author","")+field("body","Opening post","",true)+'<button class="btn red" type="submit">Create discussion</button>',fd=>{const title=String(fd.get("title")).trim(),body=String(fd.get("body")).trim();if(!title||!body)return;local.threads.push({id:"draft-"+Date.now(),title,category:String(fd.get("category")),date:String(fd.get("date")),locked:false,posts:[{author:String(fd.get("author"))||"Anonymous Member",body}]});save()});const f=()=>{const q=document.getElementById("threadSearch").value.toLowerCase();document.getElementById("threadsList").innerHTML=allThreads().filter(t=>JSON.stringify(t).toLowerCase().includes(q)).map(t=>'<div class="linkrow" data-thread="'+esc(t.id)+'"><div><div class="link-title">'+esc(t.title)+'</div><div class="threadmeta">'+esc(t.category)+' · '+esc(t.date)+'</div></div><span class="chip">'+(t.locked?"Locked":"Open")+'</span></div>').join("");document.querySelectorAll("[data-thread]").forEach(b=>b.onclick=()=>location.hash=link("forum",b.dataset.thread))};document.getElementById("threadSearch").oninput=f}
if(page==="forum"&&id&&document.getElementById("addReply"))document.getElementById("addReply").onclick=()=>{let author=document.getElementById("replyAuthor").value.trim(),body=document.getElementById("replyBody").value.trim();if(!author||!body){alert("Add an author and reply.");return}(local.replies[id]||(local.replies[id]=[])).push({author,body});save();route()};
}
function route(){let parts=decodeURIComponent(location.hash.replace(/^#\//,"")).split("/"),page=navItems.some(x=>x[0]===parts[0])?parts[0]:"home",id=parts[1]||"";renderNav(page);const pages={home,people:()=>id?personPage(id):peoplePage(),teams,timeline,scandals:()=>id?scandalPage(id):scandalList(),forum:()=>id?threadPage(id):forumPage(),manufacturers};document.getElementById("view").innerHTML=pages[page]()+ '<footer class="footer">SLOT TO SURVIVE STORY ROOM · All people, companies, organizations, documents and events in this workspace are fictional satire.<br>Not the public NSRC experience · Writer-owned draft data, with browser-local edits.</footer>';wire(page,id);window.scrollTo(0,0)}
document.getElementById("closeModal").onclick=()=>document.getElementById("editor").close();
document.getElementById("exportBtn").onclick=()=>{const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),local},null,2),url=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="slot-to-survive-storyroom-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d.local||typeof d.local!=="object")throw Error("Not a valid Story Room backup");if(!confirm("Replace this browser’s saved notes and forum drafts with the imported backup?"))return;local={notes:{},overrides:{},replies:{},threads:[],...d.local};save();route();alert("Backup imported.")}catch(err){alert(err.message)}e.target.value=""};
window.StoryRoom={getLocal:()=>JSON.parse(JSON.stringify(local)),getBase:()=>JSON.parse(JSON.stringify(BASE)),setBase:data=>{BASE=data;route()},setLocal:value=>{local=value;try{localStorage.setItem(KEY,JSON.stringify(local))}catch{}},render:route};window.addEventListener("hashchange",route);route();
})();
</script><script src="./sync.js"></script></body></html>
